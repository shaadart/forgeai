[project]
name = "forgeai"
version = "0.1.0"
description = "Builds a document-grounded agent from one paragraph, tests it, and reports what still fails."
requires-python = ">=3.11"
dependencies = [
    "fastembed>=0.4",
    "numpy>=1.26",
    "pydantic>=2.7",
    "pypdf>=4",
    "python-docx>=1.1",
    "pyyaml>=6",
    "rapidfuzz>=3.9",
]

[project.scripts]
forge = "forge.cli:main"

[project.optional-dependencies]
ui = [
    "gradio>=6.32.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["forge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
